[workspace]
resolver = "3"
members = ["crates/ezrs"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Go-style application patterns for Rust CLI apps, workers, and background jobs."
repository = "https://github.com/christiandoxa/ezrs"
homepage = "https://github.com/christiandoxa/ezrs"
documentation = "https://docs.rs/ezrs"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
